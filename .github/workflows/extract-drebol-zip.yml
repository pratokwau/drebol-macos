name: Extract Drebol ZIP

on:
  workflow_dispatch:

permissions:
  contents: write
  workflows: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract archive and commit files
        run: |
          set -e
          test -f drebol-macos.zip
          unzip -o drebol-macos.zip
          if [ -d drebol-macos ] && [ -f drebol-macos/pubspec.yaml ]; then
            shopt -s dotglob
            mv drebol-macos/* .
            rmdir drebol-macos
          fi
          rm -f drebol-macos.zip
          rm -f .github/workflows/extract-drebol-zip.yml
          echo "Extracted file count:"
          find . -path ./.git -prune -o -type f -print | wc -l
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short | head -n 50
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Drebol VPN macOS 0.1.0"
            git push
          fi
